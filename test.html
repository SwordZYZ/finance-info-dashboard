<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金融图表 · 兼容性测试</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { margin: 0; background: light-dark(#f5f5f7, #1c1c1e); color: light-dark(#1d1d1f, #f5f5f7); }
    main { max-width: 1440px; margin: auto; padding: 20px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 8px 0 16px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    label { display: flex; align-items: center; gap: 6px; }
    select, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #8886; }
    a { color: light-dark(#006bd6, #80baff); }
    #status { padding: 14px; border: 1px solid #8886; border-radius: 10px; margin-bottom: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.7 ui-monospace, monospace; }
    .preview { overflow: auto; border: 1px solid #8886; border-radius: 12px; }
    iframe { display: block; border: 0; background: white; width: 100%; height: 900px; }
    .hint { font-size: 13px; opacity: .75; }
    @media (max-width: 600px) { main { padding: 12px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
<main>
  <h1>金融图表兼容性测试</h1>
  <p>先检查默认 Canvas，再切换 SVG 对照。若只有 Canvas 空白，说明问题集中在绘图环节；若两者均空白，请查看下方加载状态。</p>
  <div class="controls">
    <label>绘图方式
      <select id="renderer"><option value="canvas">Canvas（原页面默认）</option><option value="svg">SVG（对照）</option></select>
    </label>
    <label>页面宽度
      <select id="viewport"><option value="auto">当前设备</option><option value="1440">Mac · 1440</option><option value="810">iPad 竖屏 · 810</option><option value="1080">iPad 横屏 · 1080</option><option value="390">iPhone 竖屏 · 390</option><option value="844">iPhone 横屏 · 844</option></select>
    </label>
    <button id="reload" type="button">重新加载</button>
    <a id="direct" href="index.html?renderer=canvas" target="_blank" rel="noopener">单独打开图表</a>
  </div>
  <p class="hint">宽度选项只检查响应式布局，不会模拟操作系统。iPad Safari 的实际显示请在 iPad 上打开本页或“单独打开图表”验证。</p>
  <div id="status" role="status" aria-live="polite">正在加载测试页…</div>
  <div class="preview"><iframe id="preview" title="金融图表测试预览"></iframe></div>
</main>
<script>
  const frame = document.getElementById('preview');
  const renderer = document.getElementById('renderer');
  const viewport = document.getElementById('viewport');
  const status = document.getElementById('status');
  let started = Date.now();
  let loadFinished = false;
  let lastStatus = '';
  const errors = [];

  function updateStatus() {
    const lines = [
      `浏览器：${navigator.userAgent}`,
      `设备视口：${innerWidth} × ${innerHeight}；像素比：${devicePixelRatio}`,
      `测试方式：${renderer.value.toUpperCase()}；预览宽度：${frame.clientWidth}px`
    ];
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!loadFinished || !doc?.getElementById('main')) {
        lines.push('页面：加载中…');
      } else {
        lines.push(`图表库：${win.echarts ? '已加载 ECharts ' + win.echarts.version : '未加载，请检查 vendor/echarts-5.4.3.min.js 是否能访问'}`);
        const chart = win.echarts?.getInstanceByDom(doc.getElementById('main'));
        const series = chart?.getOption()?.series || [];
        lines.push(`数据卡片：${doc.getElementById('csi-date').innerText} / ${doc.getElementById('fred-date').innerText}`);
        lines.push(`图表：${chart ? chart.getWidth() + ' × ' + chart.getHeight() : '尚未初始化'}`);
        lines.push(`绘图节点：${doc.querySelector('#main svg') ? 'SVG' : doc.querySelector('#main canvas') ? 'Canvas' : '无'}`);
        lines.push(`曲线数据：${series.length ? series.map(s => s.name + ' ' + s.data.length + ' 点').join('；') : '尚未生成'}`);
        lines.push(`页面横向溢出：${doc.documentElement.scrollWidth > win.innerWidth ? '有' : '无'}`);
        lines.push('显示结果请目视确认：有绘图节点和数据不等于屏幕一定可见。');
      }
      if (Date.now() - started > 15000 && !doc?.querySelector('#main canvas, #main svg')) {
        lines.push('已等待超过 15 秒：若库已加载、卡片已有数值但仍无绘图节点，请对照 SVG 模式。');
      }
    } catch (error) {
      lines.push(`诊断读取失败：${error.message}`);
    }
    if (errors.length) lines.push('加载后的脚本错误：' + errors.join('；'));
    const text = lines.join('\n');
    if (text !== lastStatus) { status.textContent = text; lastStatus = text; }
  }

  function loadPreview() {
    started = Date.now();
    loadFinished = false;
    errors.length = 0;
    const url = new URL('index.html', location.href);
    url.searchParams.set('renderer', renderer.value);
    url.searchParams.set('test', String(started));
    frame.src = url.href;
    document.getElementById('direct').href = url.href;
    updateStatus();
  }
  frame.addEventListener('load', () => {
    loadFinished = true;
    frame.contentWindow.addEventListener('error', e => { errors.push(e.message); updateStatus(); });
    frame.contentWindow.addEventListener('unhandledrejection', e => { errors.push(String(e.reason)); updateStatus(); });
    updateStatus();
  });
  renderer.addEventListener('change', loadPreview);
  viewport.addEventListener('change', () => {
    frame.style.width = viewport.value === 'auto' ? '100%' : viewport.value + 'px';
    updateStatus();
  });
  document.getElementById('reload').addEventListener('click', loadPreview);
  window.addEventListener('resize', updateStatus);
  setInterval(updateStatus, 1000);
  loadPreview();
</script>
</body>
</html>
